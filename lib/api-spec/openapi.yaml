  # PAYROLL
  /payroll:
    get:
      operationId: getPayrollRecords
      tags: [payroll]
      summary: List payroll records
      parameters:
        - name: month
          in: query
          schema:
            type: ["string", "null"]
        - name: branchId
          in: query
          schema:
            type: ["integer", "null"]
        - name: employeeId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
