      required: [id, type, message, isRead, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [attendance_reminder, leave_approval, salary_released, birthday_wish, announcement]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string

    Holiday:
      type: object
      required: [id, name, date]
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
        createdAt:
          type: string

    HolidayInput:
      type: object
      required: [name, date]
      properties:
        name:
          type: string
        date:
          type: string

    Settings:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        companyName:
          type: string
        companyEmail:
          type: ["string", "null"]
        companyPhone:
          type: ["string", "null"]
        companyAddress:
          type: ["string", "null"]
        overtimeRatePerHour:
          type: number
        continueDutyRate:
          type: number
        lateDeductionPerMinute:
          type: number
        gracePeriodMinutes:
          type: integer
        workingHoursPerDay:
          type: number
        updatedAt:
          type: string

    SettingsUpdate:
      type: object
      properties:
        companyName:
          type: string
        companyEmail:
          type: ["string", "null"]
        companyPhone:
          type: ["string", "null"]
        companyAddress:
          type: ["string", "null"]
        overtimeRatePerHour:
          type: number
        continueDutyRate:
          type: number
        lateDeductionPerMinute:
          type: number
        gracePeriodMinutes:
          type: integer
        workingHoursPerDay:
          type: number

    AuditLog:
      type: object
      required: [id, action, entity, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
        action:
          type: string
        entity:
          type: string
        entityId:
          type: ["integer", "null"]
        changes:
          type: ["string", "null"]
        createdAt:
          type: string

    AttendanceReportRow:
      type: object
      required: [employeeId, employeeName, employeeCode]
      properties:
        employeeId:
          type: integer
        employeeName:
          type: string
        employeeCode:
          type: string
        department:
          type: string
        branchName:
          type: string
        presentDays:
          type: integer
        absentDays:
          type: integer
        weeklyOffDays:
          type: integer
        leaveDays:
          type: integer
        lateDays:
          type: integer
        overtimeHours:
          type: number
        workingHours:
          type: number

    PayrollReportRow:
      type: object
      required: [employeeId, employeeName, month, netSalary]
      properties:
        employeeId:
          type: integer
        employeeName:
          type: string
        employeeCode:
          type: string
        department:
          type: string
        branchName:
          type: string
        basicSalary:
          type: number
        grossSalary:
          type: number
        totalDeductions:
          type: number
        netSalary:
          type: number
        month:
          type: string
        status:
          type: string

    LeaveReportRow:
      type: object
      required: [employeeId, employeeName]
      properties:
        employeeId:
          type: integer
        employeeName:
          type: string
        employeeCode:
          type: string
        department:
          type: string
        casualLeaves:
          type: integer
        sickLeaves:
          type: integer
        earnedLeaves:
          type: integer
        lossOfPayLeaves:
          type: integer
        totalLeaves:
          type: integer
        pendingLeaves:
          type: integer
        approvedLeaves:
          type: integer
