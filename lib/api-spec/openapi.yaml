                  $ref: "#/components/schemas/WeeklyOffPolicy"
    post:
      operationId: createWeeklyOffPolicy
      tags: [weeklyOff]
      summary: Create a weekly off policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyOffPolicyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyOffPolicy"

  /weekly-off-policies/{id}:
    get:
      operationId: getWeeklyOffPolicy
      tags: [weeklyOff]
      summary: Get a weekly off policy
      parameters:
        - name: id
