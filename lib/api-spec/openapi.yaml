      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advance"

  # CONTINUE DUTY
  /continue-duties:
    get:
      operationId: getContinueDuties
      tags: [continueDuty]
      summary: List continue duty entries
      parameters:
