  /continue-duties/{id}:
    get:
      operationId: getContinueDuty
      tags: [continueDuty]
      summary: Get a continue duty entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueDuty"
    patch:
      operationId: updateContinueDuty
      tags: [continueDuty]
      summary: Update a continue duty entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinueDutyUpdate"
      responses:
        "200":
          description: OK
