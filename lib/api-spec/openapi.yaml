            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRecord"

  /payroll/{id}:
    get:
      operationId: getPayrollRecord
      tags: [payroll]
      summary: Get a payroll record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRecord"
    patch:
      operationId: updatePayrollRecord
      tags: [payroll]
      summary: Update a payroll record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRecord"

  /payroll/{id}/approve:
    patch:
      operationId: approvePayroll
      tags: [payroll]
      summary: Approve and lock payroll
      parameters:
